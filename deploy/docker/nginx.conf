# OpenReporting — nginx TLS proxy for docker-compose.yml (nginx-unprivileged: listens on 8080/8443).
# Certificates are mounted read-only at /etc/nginx/certs (cert.pem, key.pem).

limit_req_zone $binary_remote_addr zone=openreporting_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=openreporting_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=openreporting_heavy:10m rate=12r/m;

upstream openreporting_app {
    server web:8810;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:OpenReporting:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 5m;
    server_tokens off;
    limit_req_status 429;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The browser-facing host:port; the application validates it against OPENREPORTING_PUBLIC_URL.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /metrics { return 404; }

    location = /api/login {
        limit_req zone=openreporting_login burst=5 nodelay;
        proxy_pass http://openreporting_app;
    }

    location ~ ^/api/(dashboards/export|dash-reports/preview)$ {
        limit_req zone=openreporting_heavy burst=4 nodelay;
        proxy_pass http://openreporting_app;
    }

    location /api/ {
        limit_req zone=openreporting_api burst=120 nodelay;
        proxy_pass http://openreporting_app;
    }

    location /static/ {
        proxy_pass http://openreporting_app;
        expires 1h;
    }

    location / {
        proxy_pass http://openreporting_app;
    }
}
