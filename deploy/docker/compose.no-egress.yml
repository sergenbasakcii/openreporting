# Optional overlay: web, worker and backup get NO network path out of the Docker host (no internet,
# no LAN). Only the proxy keeps an "edge" network for the published 80/443 ports.
#
#   docker compose -f docker-compose.yml -f deploy/docker/compose.no-egress.yml up -d --wait
#
# Use it to prove that OpenReporting runs fully offline after installation (docs/DOCKER.md, section
# "İnternetsiz çalışma"), or in production when every data source runs inside this Docker host.
# Data sources on the company LAN (Zabbix, databases, SMTP, LDAP) are NOT reachable with this overlay;
# for those, keep the default network and restrict outbound traffic with the host firewall instead.

services:
  proxy:
    networks:
      app: {ipv4_address: "${OPENREPORTING_PROXY_IP:-172.30.88.10}"}
      edge: {}

networks:
  app:
    internal: true
  edge: {}
