# OpenReporting — nginx HTTPS reverse proxy (generated by deploy/install-linux.sh).
# __DOMAIN__, __CERT__ and __KEY__ are substituted by the installer.

# Rate limits (per client IP). limit_req_zone is valid here: site files are included in the http block.
limit_req_zone $binary_remote_addr zone=openreporting_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=openreporting_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=openreporting_heavy:10m rate=12r/m;

upstream openreporting_app {
    server 127.0.0.1:8810;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:OpenReporting:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 5m;
    server_tokens off;
    limit_req_status 429;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Inherited by every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Report previews / PDF exports can take a while on large groups.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Prometheus metrics stay local-only (scrape 127.0.0.1:8810/metrics on the host).
    location = /metrics { return 404; }

    location = /api/login {
        limit_req zone=openreporting_login burst=5 nodelay;
        proxy_pass http://openreporting_app;
    }

    location ~ ^/api/(dashboards/export|dash-reports/preview)$ {
        limit_req zone=openreporting_heavy burst=4 nodelay;
        proxy_pass http://openreporting_app;
    }

    location /api/ {
        limit_req zone=openreporting_api burst=120 nodelay;
        proxy_pass http://openreporting_app;
    }

    location /static/ {
        proxy_pass http://openreporting_app;
        expires 1h;
    }

    location / {
        proxy_pass http://openreporting_app;
    }
}
