# Disposable PostgreSQL for CI only (ephemeral storage). Production uses a managed/operator PostgreSQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/component: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: openreporting}
            - {name: POSTGRES_USER, value: openreporting}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-ci, key: password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "openreporting", "-d", "openreporting"]}
            periodSeconds: 3
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app.kubernetes.io/component: postgres}
  ports: [{port: 5432, targetPort: 5432}]
