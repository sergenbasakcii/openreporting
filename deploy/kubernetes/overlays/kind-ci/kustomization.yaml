# CI-only overlay: disposable kind cluster, in-cluster PostgreSQL, single-node RWO volume.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openreporting
resources:
  - ../../base
  - postgres.yaml
images:
  # Matches the name the base already rewrote.
  - name: registry.example.com/openreporting/openreporting
    newName: openreporting
    newTag: ci
patches:
  - target: {kind: PersistentVolumeClaim, name: openreporting-archive}
    patch: |
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  - target: {kind: ConfigMap, name: openreporting-config}
    patch: |
      - op: replace
        path: /data/OPENREPORTING_PUBLIC_URL
        value: https://openreporting.localtest
      - op: replace
        path: /data/OPENREPORTING_PROVISION_TESTDATA
        value: "true"
      # The fixture admin exercises business APIs; mandatory enrollment is covered by the MFA browser job.
      - op: replace
        path: /data/OPENREPORTING_MFA_REQUIRED_ROLES
        value: ""
  # Without metrics-server the HPA cannot act; pin the CI replica count.
  - target: {kind: Deployment, name: openreporting-web}
    patch: |
      - op: add
        path: /spec/replicas
        value: 2
  # The 2-vCPU CI runner also hosts the control plane; production keeps the base requests.
  - target: {kind: Deployment, name: openreporting-(web|worker)}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
  - target: {kind: Ingress, name: openreporting(-login)?}
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: openreporting.localtest
      - op: replace
        path: /spec/rules/0/host
        value: openreporting.localtest
