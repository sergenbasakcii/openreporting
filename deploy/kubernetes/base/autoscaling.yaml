apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openreporting-web
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: openreporting-web}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openreporting-web
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: openreporting, app.kubernetes.io/component: web}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openreporting-worker
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: openreporting, app.kubernetes.io/component: worker}
