apiVersion: apps/v1
kind: Deployment
metadata:
  name: openreporting-web
spec:
  # No replicas field: the HorizontalPodAutoscaler owns the count (minReplicas 2), so `kubectl apply`
  # never scales a busy deployment back down.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: openreporting, app.kubernetes.io/component: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: openreporting, app.kubernetes.io/component: web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: openreporting, app.kubernetes.io/component: web}
      terminationGracePeriodSeconds: 60
      containers:
        - name: web
          image: openreporting
          args: ["openreporting", "serve", "--host", "0.0.0.0", "--port", "8810", "--allow-remote"]
          ports: [{name: http, containerPort: 8810}]
          envFrom:
            - configMapRef: {name: openreporting-config}
            - secretRef: {name: openreporting-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
          # The app trusts only its public host and loopback names; kubelet probes would send the pod IP.
          startupProbe:
            httpGet: {path: /healthz, port: http, httpHeaders: [{name: Host, value: 127.0.0.1}]}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /healthz, port: http, httpHeaders: [{name: Host, value: 127.0.0.1}]}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /api/health, port: http, httpHeaders: [{name: Host, value: 127.0.0.1}]}
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/openreporting}
            - {name: key, mountPath: /run/openreporting-key, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: openreporting-archive}
        - name: key
          secret: {secretName: openreporting-key, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: openreporting-web
spec:
  selector: {app.kubernetes.io/name: openreporting, app.kubernetes.io/component: web}
  ports: [{name: http, port: 8810, targetPort: http}]
