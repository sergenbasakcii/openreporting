# One active report worker holds a PostgreSQL advisory lock; the second replica waits as hot
# standby and takes over within seconds when the active pod or its database session ends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openreporting-worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: openreporting, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: openreporting, app.kubernetes.io/component: worker}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: openreporting
          args: ["openreporting", "worker"]
          envFrom:
            - configMapRef: {name: openreporting-config}
            - secretRef: {name: openreporting-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 3Gi}
          # Fresh heartbeat of whichever worker is active; a hung active worker restarts both.
          livenessProbe:
            exec: {command: ["openreporting", "worker-health", "--max-age", "180"]}
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - {name: data, mountPath: /var/lib/openreporting}
            - {name: key, mountPath: /run/openreporting-key, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: openreporting-archive}
        - name: key
          secret: {secretName: openreporting-key, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
